name: Build and publish releases
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Run local safety tests
        run: python -m unittest discover -s tests -v
      - name: Build standalone executable
        run: python -m PyInstaller --noconfirm installer.spec
      - name: Verify standalone executable
        run: python smoke.py
      - name: Create ZIP
        run: python make_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: firetv-customhome-${{ matrix.os }}
          path: releases/*.zip
          if-no-files-found: error
  release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: firetv-customhome-*
          path: release-files
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            release_tag="$GITHUB_REF_NAME"
          else
            release_tag="0.1.$GITHUB_RUN_NUMBER"
          fi
          helper="ghostlock-sheldon-1.1.0-original-arm"
          curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/$helper" -o "$helper" || \
            curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/download/0.1.17/$helper" -o "$helper"
          echo "e6c5afb143ebf03114b941b1298b0d8b9b7d156071d6d37deb4fdcb09fbd1b32  $helper" | sha256sum -c -
          gh release create "$release_tag" release-files/*.zip "$helper" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$release_tag" --notes "See README and LEEME.es.md for setup and supported devices."
